<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quickland CRM - Ventas en Campo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

  <!-- Header Superior Móvil -->
  <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-satellite-dish text-xl"></i>
      <h1 class="font-bold text-lg tracking-wide">Quickland CRM</h1>
    </div>
    <a href="/backoffice" class="text-xs bg-blue-700 px-3 py-1.5 rounded-full hover:bg-blue-800 transition">
      Modo Back Office →
    </a>
  </header>

  <!-- Pestañas de Navegación Móvil -->
  <div class="max-w-md mx-auto p-4">
    <div class="flex bg-slate-200 p-1 rounded-xl mb-4 text-sm font-medium">
      <button id="tabRegistrar" onclick="cambiarPestana('registrar')" class="flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition">
        <i class="fa-solid fa-plus-circle mr-1"></i> Nueva Venta
      </button>
      <button id="tabVentas" onclick="cambiarPestana('ventas')" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">
        <i class="fa-solid fa-list-check mr-1"></i> Mis Ventas
      </button>
    </div>

    <!-- SECCIÓN 1: FORMULARIO DE NUEVA VENTA -->
    <div id="seccionRegistrar" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
      <h2 class="text-base font-bold text-slate-800 mb-3 flex items-center">
        <i class="fa-solid fa-user-tag text-blue-600 mr-2"></i> Ingreso de Venta en Terreno
      </h2>

      <form id="formVenta" onsubmit="enviarVenta(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Asesor (Tú)</label>
          <input type="text" id="asesor_campo" required placeholder="Ej. CARLOS PÉREZ" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo del Cliente</label>
          <input type="text" id="cliente_nombre" required placeholder="Ej. Juan Gómez Salazar" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">DNI / Documento</label>
            <input type="tel" id="cliente_dni" required maxlength="12" placeholder="8 dígitos" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono Móvil</label>
            <input type="tel" id="cliente_telefono" required maxlength="12" placeholder="987654321" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección y Distrito</label>
          <input type="text" id="direccion" required placeholder="Av. Principal 123, Dpto 4, Distrito" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Plan / Producto</label>
          <select id="plan_producto" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
            <option value="">Selecciona el plan...</option>
            <option value="Fibra Óptica 100 Mbps">Fibra Óptica 100 Mbps</option>
            <option value="Fibra Óptica 200 Mbps">Fibra Óptica 200 Mbps</option>
            <option value="Fibra Óptica 300 Mbps">Fibra Óptica 300 Mbps</option>
            <option value="Dúo Fibra + TV">Dúo Fibra + TV</option>
            <option value="Otro">Otro servicio</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Observaciones / Horario de contacto</label>
          <textarea id="observaciones" rows="2" placeholder="Llamar después de las 3pm, portón negro..." class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="btnGuardar" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Subir Venta al CRM</span>
        </button>
      </form>
    </div>

    <!-- SECCIÓN 2: MIS VENTAS (ESTADO EN TIEMPO REAL) -->
    <div id="seccionVentas" class="hidden space-y-3">
      <div class="relative">
        <input type="text" id="buscadorVentas" oninput="filtrarVentas()" placeholder="Buscar por DNI, cliente o asesor..." class="w-full pl-9 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>

      <div class="flex justify-between items-center px-1">
        <span id="contadorVentas" class="text-xs font-semibold text-slate-500">Cargando ventas...</span>
        <button onclick="cargarVentas()" class="text-xs text-blue-600 font-bold hover:underline flex items-center">
          <i class="fa-solid fa-rotate-right mr-1"></i> Actualizar
        </button>
      </div>

      <div id="listaVentas" class="space-y-3">
        <!-- Las tarjetas se generan dinámicamente con JavaScript -->
      </div>
    </div>
  </div>

  <script>
    let todasLasVentas = [];

    function cambiarPestana(pestana) {
      if (pestana === 'registrar') {
        document.getElementById('seccionRegistrar').classList.remove('hidden');
        document.getElementById('seccionVentas').classList.add('hidden');
        document.getElementById('tabRegistrar').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition";
        document.getElementById('tabVentas').className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
      } else {
        document.getElementById('seccionRegistrar').classList.add('hidden');
        document.getElementById('seccionVentas').classList.remove('hidden');
        document.getElementById('tabRegistrar').className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
        document.getElementById('tabVentas').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition";
        cargarVentas();
      }
    }

    async function enviarVenta(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';

      const payload = {
        asesor_campo: document.getElementById('asesor_campo').value,
        cliente_nombre: document.getElementById('cliente_nombre').value,
        cliente_dni: document.getElementById('cliente_dni').value,
        cliente_telefono: document.getElementById('cliente_telefono').value,
        direccion: document.getElementById('direccion').value,
        plan_producto: document.getElementById('plan_producto').value,
        observaciones: document.getElementById('observaciones').value,
        evidencia_drive: ""
      };

      try {
        const res = await fetch('/api/ventas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert('¡Venta registrada con éxito! Código: ' + data.id_venta);
          // Guardar el nombre del asesor para que no lo vuelva a escribir
          const asesor = document.getElementById('asesor_campo').value;
          document.getElementById('formVenta').reset();
          document.getElementById('asesor_campo').value = asesor;
          cambiarPestana('ventas');
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Error de conexión con el servidor');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i> Subir Venta al CRM';
      }
    }

    async function cargarVentas() {
      const contenedor = document.getElementById('listaVentas');
      contenedor.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="text-xs mt-2">Consultando Google Sheets...</p></div>';

      try {
        const res = await fetch('/api/ventas');
        const resJson = await res.json();
        if (resJson.status === 'success') {
          todasLasVentas = resJson.data.reverse(); // Más recientes primero
          renderizarTarjetas(todasLasVentas);
        }
      } catch (e) {
        contenedor.innerHTML = '<p class="text-xs text-red-500 text-center py-4">Error al cargar ventas</p>';
      }
    }

    function renderizarTarjetas(ventas) {
      const contenedor = document.getElementById('listaVentas');
      document.getElementById('contadorVentas').innerText = `${ventas.length} ventas encontradas`;

      if (ventas.length === 0) {
        contenedor.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs">No hay ventas registradas aún.</div>';
        return;
      }

      contenedor.innerHTML = ventas.map(v => {
        // Badges según estado
        let badgeColor = "bg-amber-100 text-amber-700 border-amber-200";
        if (v.ESTADO_GENERAL === "INSTALADO") badgeColor = "bg-emerald-100 text-emerald-700 border-emerald-200";
        if (v.ESTADO_GENERAL === "RECHAZADO BO" || v.ESTADO_GENERAL === "INST. FRUSTRADA") badgeColor = "bg-rose-100 text-rose-700 border-rose-200";
        if (v.ESTADO_GENERAL === "SUBIDO / EN RUTA") badgeColor = "bg-blue-100 text-blue-700 border-blue-200";

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-mono font-bold text-slate-400">${v.ID_VENTA}</span>
                <h3 class="text-sm font-bold text-slate-800 leading-tight">${v.CLIENTE_NOMBRE}</h3>
                <p class="text-xs text-slate-500 font-medium">${v.PLAN_PRODUCTO}</p>
              </div>
              <span class="text-[11px] font-bold px-2.5 py-1 rounded-full border ${badgeColor}">
                ${v.ESTADO_GENERAL || 'PENDIENTE'}
              </span>
            </div>

            <!-- Indicadores de avance en tiempo real -->
            <div class="grid grid-cols-3 gap-1 pt-2 text-[10px] text-center border-t border-slate-100">
              <div class="p-1.5 rounded-lg ${v.ESTADO_BO === 'Contactado' ? 'bg-blue-50 text-blue-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                <i class="fa-solid fa-phone mr-1"></i> BO: ${v.ESTADO_BO || 'Pendiente'}
              </div>
              <div class="p-1.5 rounded-lg ${v.ESTADO_SUBIDA === 'Subido' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Subida: ${v.ESTADO_SUBIDA || 'Pendiente'}
              </div>
              <div class="p-1.5 rounded-lg ${v.ESTADO_INSTALACION === 'Instalado' ? 'bg-emerald-50 text-emerald-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                <i class="fa-solid fa-wrench mr-1"></i> ${v.ESTADO_INSTALACION || 'Pendiente'}
              </div>
            </div>

            <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1">
              <span><i class="fa-solid fa-user-tie mr-1"></i>${v.ASESOR_CAMPO}</span>
              <span><i class="fa-solid fa-calendar-days mr-1"></i>${v.FECHA_REGISTRO}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrarVentas() {
      const q = document.getElementById('buscadorVentas').value.toLowerCase();
      const filtradas = todasLasVentas.filter(v => 
        (v.CLIENTE_NOMBRE || '').toLowerCase().includes(q) ||
        (String(v.CLIENTE_DNI) || '').includes(q) ||
        (v.ASESOR_CAMPO || '').toLowerCase().includes(q)
      );
      renderizarTarjetas(filtradas);
    }
  </script>
</body>
</html>
