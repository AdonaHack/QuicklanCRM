<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quickland CRM - Ventas en Campo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-20">

  <!-- Header Superior Móvil -->
  <header class="bg-blue-600 text-white sticky top-0 z-50 shadow-md px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-satellite-dish text-xl"></i>
      <div>
        <h1 class="font-bold text-base leading-tight">Quickland CRM</h1>
        <p class="text-[10px] text-blue-200">Asesor: <strong class="text-white">{{ nombre or usuario }}</strong></p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      {% if rol == 'ADMIN' %}
      <a href="/admin" class="text-[11px] bg-blue-700 px-2.5 py-1 rounded-lg">Admin</a>
      {% endif %}
      <a href="/logout" class="text-xs bg-rose-600 hover:bg-rose-700 p-1.5 rounded-lg transition" title="Cerrar sesión">
        <i class="fa-solid fa-right-from-bracket"></i>
      </a>
    </div>
  </header>

  <div class="max-w-md mx-auto p-4 space-y-4">

    <!-- Tarjetas de Resumen de Comisiones del Asesor -->
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-[10px] text-slate-400 font-bold uppercase">Ventas Exitosas</p>
        <h4 id="kpiInstaladas" class="text-xl font-black text-emerald-600 mt-0.5">0</h4>
        <span class="text-[10px] text-slate-400">Instaladas al 100%</span>
      </div>

      <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-[10px] text-slate-400 font-bold uppercase">Comisión por Cobrar</p>
        <h4 id="kpiComision" class="text-xl font-black text-blue-600 mt-0.5">S/ 0.00</h4>
        <span id="kpiFechaPago" class="text-[10px] text-slate-400">Pendiente de fecha</span>
      </div>
    </div>

    <!-- Pestañas de Navegación Móvil -->
    <div class="flex bg-slate-200 p-1 rounded-xl text-sm font-medium">
      <button id="tabRegistrar" onclick="cambiarPestana('registrar')" class="flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition">
        <i class="fa-solid fa-plus-circle mr-1"></i> Nueva Venta
      </button>
      <button id="tabVentas" onclick="cambiarPestana('ventas')" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">
        <i class="fa-solid fa-list-check mr-1"></i> Mis Ventas (<span id="badgeTotal">0</span>)
      </button>
    </div>

    <!-- SECCIÓN 1: FORMULARIO DE NUEVA VENTA -->
    <div id="seccionRegistrar" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
      <form id="formVenta" onsubmit="enviarVenta(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo del Cliente</label>
          <input type="text" id="cliente_nombre" required placeholder="Ej. Juan Gómez Salazar" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">DNI / Documento</label>
            <input type="tel" id="cliente_dni" required maxlength="12" placeholder="8 dígitos" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono Móvil</label>
            <input type="tel" id="cliente_telefono" required maxlength="12" placeholder="987654321" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Dirección y Distrito</label>
          <input type="text" id="direccion" required placeholder="Av. Principal 123, Dpto 4, Distrito" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Plan / Producto</label>
            <select id="plan_producto" required onchange="autocompletarPrecio()" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="">Selecciona...</option>
              <option value="Fibra 100 Mbps" data-precio="65">Fibra 100 Mbps</option>
              <option value="Fibra 200 Mbps" data-precio="85">Fibra 200 Mbps</option>
              <option value="Fibra 300 Mbps" data-precio="105">Fibra 300 Mbps</option>
              <option value="Dúo Fibra + TV" data-precio="120">Dúo Fibra + TV</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Precio Plan (S/)</label>
            <input type="number" id="precio_plan" required placeholder="65" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50 font-bold">
          </div>
        </div>

        <!-- Campo para Subir Documentos (DNI, Recibos) -->
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Documentos (DNI frontal/reverso, recibo) - Máx 4.</label>
          <input type="file" id="documentos_venta" multiple accept=".jpg,.jpeg,.png,.pdf" onchange="validarArchivos(this)" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 bg-white text-xs text-slate-500 file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Observaciones para Back Office</label>
          <textarea id="observaciones" rows="2" placeholder="Llamar en las tardes, portón azul..." class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
        </div>

        <button type="submit" id="btnGuardar" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition flex items-center justify-center space-x-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Subir Venta</span>
        </button>
      </form>
    </div>

    <!-- SECCIÓN 2: MIS VENTAS (ESTADO EN TIEMPO REAL) -->
    <div id="seccionVentas" class="hidden space-y-3">
      <div class="relative">
        <input type="text" id="buscadorVentas" oninput="filtrarVentas()" placeholder="Buscar por DNI o cliente..." class="w-full pl-9 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
      </div>

      <div id="listaVentas" class="space-y-3">
        <!-- Tarjetas dinámicas -->
      </div>
    </div>
  </div>

  <script>
    let misVentas = [];

    function autocompletarPrecio() {
      const select = document.getElementById('plan_producto');
      const opt = select.options[select.selectedIndex];
      const precio = opt.getAttribute('data-precio') || '';
      document.getElementById('precio_plan').value = precio;
    }

    function cambiarPestana(pestana) {
      if (pestana === 'registrar') {
        document.getElementById('seccionRegistrar').classList.remove('hidden');
        document.getElementById('seccionVentas').classList.add('hidden');
        document.getElementById('tabRegistrar').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition";
        document.getElementById('tabVentas').className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
      } else {
        document.getElementById('seccionRegistrar').classList.add('hidden');
        document.getElementById('seccionVentas').classList.remove('hidden');
        document.getElementById('tabRegistrar').className = "flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition";
        document.getElementById('tabVentas').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-600 font-semibold transition";
        cargarVentas();
      }
    }

    function validarArchivos(input) {
        if (input.files.length > 4) {
            alert("Solo puedes subir un máximo de 4 documentos por venta.");
            input.value = ""; // Limpia la selección
        }
    }

    async function enviarVenta(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';

      // Nota: Si implementas carga de archivos reales hacia tu backend, 
      // cambiarás esto por FormData. Por ahora mantiene la compatibilidad con el backend JSON.
      const payload = {
        cliente_nombre: document.getElementById('cliente_nombre').value,
        cliente_dni: document.getElementById('cliente_dni').value,
        cliente_telefono: document.getElementById('cliente_telefono').value,
        direccion: document.getElementById('direccion').value,
        plan_producto: document.getElementById('plan_producto').value,
        precio_plan: document.getElementById('precio_plan').value,
        observaciones: document.getElementById('observaciones').value
      };

      try {
        const res = await fetch('/api/ventas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.status === 'success') {
          alert('¡Venta registrada con éxito! Código: ' + data.id_venta);
          document.getElementById('formVenta').reset();
          cambiarPestana('ventas');
        } else {
          alert('Error: ' + data.message);
        }
      } catch (err) {
        alert('Error de conexión con el servidor');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Subir Venta</span>';
      }
    }

    async function cargarVentas() {
      const contenedor = document.getElementById('listaVentas');
      contenedor.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="text-xs mt-2">Consultando tus ventas...</p></div>';

      try {
        const res = await fetch('/api/ventas');
        const resJson = await res.json();
        if (resJson.status === 'success') {
          misVentas = resJson.data.reverse();
          actualizarResumen();
          renderizarTarjetas(misVentas);
        }
      } catch (e) {
        contenedor.innerHTML = '<p class="text-xs text-red-500 text-center py-4">Error al cargar datos</p>';
      }
    }

    function actualizarResumen() {
      document.getElementById('badgeTotal').innerText = misVentas.length;
      const instaladas = misVentas.filter(v => v.ESTADO_INSTALACION === 'Instalado').length;
      document.getElementById('kpiInstaladas').innerText = instaladas;

      let comisionTotal = 0;
      let proxPago = "Pendiente de fecha";

      misVentas.forEach(v => {
        if (v.ESTADO_COMISION === 'Comisionado' || v.ESTADO_COMISION === 'Por liquidar') {
          comisionTotal += parseFloat(v.MONTO_COMISION || 0);
        }
        if (v.FECHA_PAGO_COMISION && v.ESTADO_COMISION === 'Comisionado') {
          proxPago = `Cobro: ${v.FECHA_PAGO_COMISION}`;
        }
      });

      document.getElementById('kpiComision').innerText = `S/ ${comisionTotal.toFixed(2)}`;
      document.getElementById('kpiFechaPago').innerText = proxPago;
    }

    function renderizarTarjetas(ventas) {
      const contenedor = document.getElementById('listaVentas');
      if (ventas.length === 0) {
        contenedor.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-slate-400 text-xs">No tienes ventas registradas aún.</div>';
        return;
      }

      contenedor.innerHTML = ventas.map(v => {
        let badgeColor = "bg-amber-100 text-amber-700 border-amber-200";
        if (v.ESTADO_GENERAL === "INSTALADO") badgeColor = "bg-emerald-100 text-emerald-700 border-emerald-200";
        if (v.ESTADO_GENERAL === "RECHAZADO BO" || v.ESTADO_GENERAL === "INST. FRUSTRADA") badgeColor = "bg-rose-100 text-rose-700 border-rose-200";

        let badgeComision = "bg-slate-100 text-slate-600";
        if (v.ESTADO_COMISION === "Comisionado") badgeComision = "bg-emerald-100 text-emerald-700 font-bold";
        if (v.ESTADO_COMISION === "Por liquidar") badgeComision = "bg-blue-100 text-blue-700 font-bold";

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2.5">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-[10px] font-mono font-bold text-slate-400">${v.ID_VENTA}</span>
                <h3 class="text-sm font-bold text-slate-800 leading-tight">${v.CLIENTE_NOMBRE}</h3>
                <p class="text-xs text-slate-500 font-medium">${v.PLAN_PRODUCTO} • S/ ${v.PRECIO_PLAN || 0}</p>
              </div>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">
                ${v.ESTADO_GENERAL || 'PENDIENTE'}
              </span>
            </div>

            <!-- Datos de Comisión -->
            <div class="bg-slate-50 p-2 rounded-xl flex justify-between items-center text-[11px]">
              <div>
                <span class="text-slate-400">Comisión estimada:</span>
                <strong class="text-slate-700 ml-1">S/ ${v.MONTO_COMISION || 0}</strong>
              </div>
              <span class="px-2 py-0.5 rounded-lg text-[10px] ${badgeComision}">
                ${v.ESTADO_COMISION || 'Pendiente'}
              </span>
            </div>

            <!-- Avance operativo -->
            <div class="grid grid-cols-3 gap-1 text-[10px] text-center border-t border-slate-100 pt-2">
              <div class="p-1 rounded ${v.ESTADO_BO === 'Contactado' ? 'bg-blue-50 text-blue-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                BO: ${v.ESTADO_BO || 'Pendiente'}
              </div>
              <div class="p-1 rounded ${v.ESTADO_SUBIDA === 'Subido' ? 'bg-indigo-50 text-indigo-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                Subida: ${v.ESTADO_SUBIDA || 'Pendiente'}
              </div>
              <div class="p-1 rounded ${v.ESTADO_INSTALACION === 'Instalado' ? 'bg-emerald-50 text-emerald-700 font-bold' : 'bg-slate-50 text-slate-400'}">
                ${v.ESTADO_INSTALACION || 'Pendiente'}
              </div>
            </div>

            ${v.OBSERVACIONES ? `<p class="text-[11px] text-slate-500 italic bg-amber-50/50 p-2 rounded-lg border border-amber-100"><i class="fa-solid fa-comment-dots text-amber-500 mr-1"></i>${v.OBSERVACIONES}</p>` : ''}
          </div>
        `;
      }).join('');
    }

    function filtrarVentas() {
      const q = document.getElementById('buscadorVentas').value.toLowerCase();
      const filtradas = misVentas.filter(v => 
        (v.CLIENTE_NOMBRE || '').toLowerCase().includes(q) ||
        (String(v.CLIENTE_DNI) || '').includes(q)
      );
      renderizarTarjetas(filtradas);
    }

    cargarVentas();
  </script>
</body>
</html>
